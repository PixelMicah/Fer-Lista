<script>
const SUPABASE_URL = "https://qhktptxhesblipafrojq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoa3RwdHhoZXNibGlwYWZyb2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMjc4NjksImV4cCI6MjA3OTkwMzg2OX0.8HsuDeeFMW-hyDcKcx8E4O5aZdVlgeG84q2goSt3tZo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function cargarDatos() {
  const { data } = await sb
    .from("lista_completa")
    .select("*");

  data.forEach(row => {
    const txt = document.getElementById("miTexto" + row.id);
    const chk = document.getElementById("miCheck" + row.id);
    if (!txt || !chk) return;

    txt.value = row.texto || "";
    chk.checked = row.checked || false;

    txt.oninput = () => {
      sb.from("lista_completa")
        .update({ texto: txt.value })
        .eq("id", row.id);
    };

    chk.onchange = () => {
      sb.from("lista_completa")
        .update({ checked: chk.checked })
        .eq("id", row.id);
    };
  });
}

cargarDatos();

sb.channel("lista-realtime")
  .on(
    "postgres_changes",
    { event: "UPDATE", schema: "public", table: "lista_completa" },
    payload => {
      const row = payload.new;
      const txt = document.getElementById("miTexto" + row.id);
      const chk = document.getElementById("miCheck" + row.id);
      if (!txt || !chk) return;

      txt.value = row.texto || "";
      chk.checked = row.checked || false;
    }
  )
  .subscribe();
</script>
